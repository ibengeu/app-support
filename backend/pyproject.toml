[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.44.0",
    "fastapi>=0.162.2",
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.19",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
